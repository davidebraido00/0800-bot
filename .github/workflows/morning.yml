name: 0800

on:
  # Avvio principale: un cron esterno (cron-job.org) chiama l'API di GitHub alle 7:50 ora italiana
  # con programmato=true. Il cron di GitHub su questo repository parte con ore di ritardo o salta.
  workflow_dispatch:
    inputs:
      programmato:
        description: "Avvio programmato: attende le 8:00 e non invia due volte nello stesso giorno"
        type: boolean
        default: false
  # Riserva: i cron di GitHub. Se arrivano tardi (dopo le 11) o dopo un invio già fatto, saltano.
  schedule:
    - cron: "41 5 * * *"  # 7:41 con l'ora legale (UTC+2)
    - cron: "11 6 * * *"  # 8:11 con l'ora legale
    - cron: "41 6 * * *"  # 7:41 con l'ora solare (UTC+1)
    - cron: "11 7 * * *"  # 8:11 con l'ora solare

# Un'esecuzione alla volta: quelle successive aspettano, poi vedono il segno "inviato" e saltano
concurrency:
  group: invio-0800
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    outputs:
      oggi: ${{ steps.quando.outputs.oggi }}
      programmato: ${{ steps.quando.outputs.programmato }}
      offset: ${{ steps.quando.outputs.offset }}
      gia_inviato: ${{ steps.segno.outputs.cache-hit }}
    steps:
      - id: quando
        run: |
          echo "oggi=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.programmato }}" = "true" ]; then
            echo "programmato=true" >> "$GITHUB_OUTPUT"
          else
            echo "programmato=false" >> "$GITHUB_OUTPUT"
          fi
          # Solo i cron di GitHub (in UTC) devono sapere se valgono per l'ora legale o solare
          case "${{ github.event.schedule }}" in
            "41 5 * * *"|"11 6 * * *") echo "offset=2" >> "$GITHUB_OUTPUT" ;;
            "41 6 * * *"|"11 7 * * *") echo "offset=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "offset=" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: segno
        if: steps.quando.outputs.programmato == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .inviato
          key: inviato-${{ steps.quando.outputs.oggi }}
          lookup-only: true
      - if: steps.segno.outputs.cache-hit == 'true'
        run: echo "Il riepilogo di oggi è già stato inviato, salto."

  send:
    needs: controllo
    if: needs.controllo.outputs.gia_inviato != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Invia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PROVIDER: ${{ vars.WHATSAPP_PROVIDER || 'callmebot' }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          GOOGLE_CALENDAR_ICS: ${{ secrets.GOOGLE_CALENDAR_ICS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          OFFSET: ${{ needs.controllo.outputs.offset }}
        # Manuale: invia subito. Programmato: attende le 8:00 e lascia il segno "inviato".
        run: |
          if [ "${{ needs.controllo.outputs.programmato }}" = "true" ]; then
            python main.py --alle 8 ${OFFSET:+--offset "$OFFSET"} --segna .inviato
          else
            python main.py
          fi
      - name: Segna come inviato
        if: always() && needs.controllo.outputs.programmato == 'true' && hashFiles('.inviato') != ''
        uses: actions/cache/save@v6
        with:
          path: .inviato
          key: inviato-${{ needs.controllo.outputs.oggi }}
