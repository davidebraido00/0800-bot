name: 0800

on:
  schedule:
    # GitHub usa UTC e a volte ritarda o salta i cron, soprattutto allo scoccare dell'ora.
    # Per ogni fuso: avvio principale alle 7:41 (attende le 8:00) e riserva alle 8:11.
    # Un segno salvato in cache evita il doppio invio nello stesso giorno.
    - cron: "41 5 * * *"  # 7:41 con l'ora legale (UTC+2)
    - cron: "11 6 * * *"  # 8:11 con l'ora legale, riserva
    - cron: "41 6 * * *"  # 7:41 con l'ora solare (UTC+1)
    - cron: "11 7 * * *"  # 8:11 con l'ora solare, riserva
  workflow_dispatch: {}  # pulsante "Run workflow": invia subito, sempre

# Un'esecuzione alla volta: la riserva aspetta che la principale finisca, poi vede il segno e salta
concurrency:
  group: invio-0800
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    outputs:
      oggi: ${{ steps.quando.outputs.oggi }}
      offset: ${{ steps.quando.outputs.offset }}
      gia_inviato: ${{ steps.segno.outputs.cache-hit }}
    steps:
      - id: quando
        run: |
          echo "oggi=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"
          case "${{ github.event.schedule }}" in
            "41 5 * * *"|"11 6 * * *") echo "offset=2" >> "$GITHUB_OUTPUT" ;;
            *) echo "offset=1" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: segno
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .inviato
          key: inviato-${{ steps.quando.outputs.oggi }}
          lookup-only: true
      - if: steps.segno.outputs.cache-hit == 'true'
        run: echo "Il riepilogo di oggi è già stato inviato, salto."

  send:
    needs: controllo
    if: needs.controllo.outputs.gia_inviato != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Invia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PROVIDER: ${{ vars.WHATSAPP_PROVIDER || 'callmebot' }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          GOOGLE_CALENDAR_ICS: ${{ secrets.GOOGLE_CALENDAR_ICS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        # Manuale: invia subito. Programmato: attende le 8 (solo il cron del fuso giusto) e lascia il segno.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py
          else
            python main.py --alle 8 --offset ${{ needs.controllo.outputs.offset }} --segna .inviato
          fi
      - name: Segna come inviato
        if: always() && github.event_name == 'schedule' && hashFiles('.inviato') != ''
        uses: actions/cache/save@v6
        with:
          path: .inviato
          key: inviato-${{ needs.controllo.outputs.oggi }}
