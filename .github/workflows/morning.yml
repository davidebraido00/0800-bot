name: 0800

on:
  schedule:
    # GitHub usa UTC e ritarda spesso i cron allo scoccare dell'ora: partiamo alle 7:41
    # (minuto poco affollato) e lo script attende fino alle 8:00.
    - cron: "41 5 * * *"  # 7:41 con l'ora legale (UTC+2)
    - cron: "41 6 * * *"  # 7:41 con l'ora solare (UTC+1)
  workflow_dispatch: {}  # pulsante "Run workflow" per test manuali

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Invia
        env:
          WHATSAPP_PROVIDER: ${{ vars.WHATSAPP_PROVIDER || 'callmebot' }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          GOOGLE_CALENDAR_ICS: ${{ secrets.GOOGLE_CALENDAR_ICS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        # Avvio manuale: invia subito. Avvio programmato: attende le 8 (solo il cron del fuso giusto).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py
          elif [ "${{ github.event.schedule }}" = "41 5 * * *" ]; then
            python main.py --alle 8 --offset 2
          else
            python main.py --alle 8 --offset 1
          fi
