# Una pillola al giorno, a rotazione. Aggiungine quante vuoi.

- emoji: "📈"
  titolo: "L'interesse composto"
  testo: "Gli interessi producono altri interessi. 10.000 € al 5% annuo diventano circa 16.300 € in 10 anni e 43.200 € in 30: il tempo conta più della cifra iniziale."
- emoji: "🧠"
  titolo: "Avversione alla perdita"
  testo: "Secondo Kahneman e Tversky una perdita ci pesa circa il doppio di un guadagno equivalente. Per questo tendiamo a tenere troppo a lungo gli investimenti in perdita e a vendere troppo presto quelli in guadagno."
- emoji: "🍅"
  titolo: "La tecnica del pomodoro"
  testo: "25 minuti di lavoro concentrato e 5 di pausa; dopo quattro cicli, una pausa più lunga. L'ha inventata Francesco Cirillo alla fine degli anni '80 e prende il nome dal suo timer da cucina a forma di pomodoro."
- emoji: "🌷"
  titolo: "La bolla dei tulipani"
  testo: "Nel 1637, in Olanda, alcuni bulbi di tulipano arrivarono a costare quanto una casa, prima di crollare nel giro di pochi giorni. È considerata una delle prime bolle speculative della storia."
- emoji: "🔵"
  titolo: "Perché il cielo è blu"
  testo: "La luce del Sole contiene tutti i colori, ma l'atmosfera diffonde molto di più le lunghezze d'onda corte, cioè il blu. Al tramonto la luce attraversa più aria, il blu si disperde e restano rossi e arancioni."
- emoji: "🔢"
  titolo: "La regola del 72"
  testo: "Dividi 72 per il rendimento annuo e ottieni in quanti anni raddoppia il capitale: al 6% servono circa 12 anni, all'8% circa 9. Vale anche per l'inflazione: al 3% i prezzi raddoppiano in circa 24 anni."
- emoji: "⚓"
  titolo: "L'effetto ancoraggio"
  testo: "Il primo numero che sentiamo condiziona le valutazioni successive, anche se è casuale. In una trattativa chi fa la prima offerta spesso fissa l'«ancora» attorno a cui si chiuderà l'accordo."
- emoji: "⏱️"
  titolo: "La regola dei 2 minuti"
  testo: "Se una cosa richiede meno di due minuti, falla subito: annotarla e riprenderla dopo costa più tempo che farla. Viene dal metodo Getting Things Done di David Allen."
- emoji: "🚢"
  titolo: "La prima azione"
  testo: "La Compagnia olandese delle Indie orientali (VOC), fondata nel 1602, fu la prima società a emettere azioni negoziabili pubblicamente. Ad Amsterdam nacque così una delle prime Borse moderne."
- emoji: "☀️"
  titolo: "8 minuti di ritardo"
  testo: "La luce del Sole impiega circa 8 minuti e 20 secondi per arrivare sulla Terra. Quando guardi il Sole, lo vedi com'era oltre 8 minuti fa."
- emoji: "💸"
  titolo: "L'inflazione"
  testo: "Con un'inflazione al 2% annuo, tra 10 anni 100 € compreranno quanto 82 € di oggi. Tenere tutto fermo sul conto corrente significa perdere potere d'acquisto ogni anno."
- emoji: "🔍"
  titolo: "Il bias di conferma"
  testo: "Tendiamo a cercare e ricordare le informazioni che confermano ciò che pensiamo già. Un buon antidoto: prima di una decisione importante, cerca attivamente le ragioni per cui potresti sbagliare."
- emoji: "🗂️"
  titolo: "La matrice di Eisenhower"
  testo: "Dividi le attività in quattro gruppi: urgenti e importanti (falle), importanti ma non urgenti (pianificale), urgenti ma non importanti (delegale), né l'una né l'altra (eliminale). Il segreto è dedicare più tempo al secondo gruppo."
- emoji: "🏦"
  titolo: "La banca più antica"
  testo: "Il Monte dei Paschi di Siena, fondato nel 1472, è considerato la banca più antica del mondo ancora in attività."
- emoji: "🌍"
  titolo: "Le stagioni"
  testo: "Le stagioni non dipendono dalla distanza dal Sole ma dall'inclinazione dell'asse terrestre, circa 23,4°. Anzi, la Terra è più vicina al Sole a inizio gennaio, in pieno inverno per noi."
- emoji: "🧺"
  titolo: "La diversificazione"
  testo: "Distribuire gli investimenti su aziende, settori e Paesi diversi riduce il rischio senza rinunciare per forza al rendimento. Per il Nobel Harry Markowitz è l'unico «pasto gratis» della finanza."
- emoji: "🕳️"
  titolo: "I costi irrecuperabili"
  testo: "«Ci ho già investito tanto, non posso mollare ora»: è la fallacia dei costi irrecuperabili. Le spese passate non tornano indietro, quindi la decisione giusta guarda solo a costi e benefici futuri."
- emoji: "📐"
  titolo: "La legge di Parkinson"
  testo: "Il lavoro si espande fino a occupare tutto il tempo disponibile. Scadenze più strette, anche autoimposte, spesso producono lo stesso risultato in meno tempo."
- emoji: "📒"
  titolo: "La partita doppia"
  testo: "Nel 1494 il frate Luca Pacioli descrisse in un libro stampato a Venezia il metodo della partita doppia usato dai mercanti veneziani: ogni operazione si registra in dare e in avere. È ancora la base della contabilità mondiale."
- emoji: "🔌"
  titolo: "La legge di Moore"
  testo: "Nel 1965 Gordon Moore, poi cofondatore di Intel, osservò che il numero di transistor su un chip raddoppiava a intervalli regolari, poi stimati in circa due anni. Questa previsione ha guidato mezzo secolo di informatica."
- emoji: "🧾"
  titolo: "Cos'è un ETF"
  testo: "Un ETF è un fondo quotato in Borsa che replica un indice, per esempio l'MSCI World con oltre 1.300 aziende. Si compra come un'azione e ha costi molto bassi, spesso sotto lo 0,2% annuo."
- emoji: "📌"
  titolo: "L'effetto Zeigarnik"
  testo: "Ricordiamo meglio i compiti lasciati a metà di quelli finiti: le cose in sospeso restano in testa e creano tensione. Scriverle in una lista con un piano aiuta a liberare la mente."
- emoji: "⚖️"
  titolo: "Il principio di Pareto"
  testo: "Spesso circa l'80% dei risultati viene dal 20% delle cause: pochi clienti fanno gran parte del fatturato, poche attività producono gran parte del valore. Prende il nome dall'economista italiano Vilfredo Pareto."
- emoji: "🔢"
  titolo: "Fibonacci e i numeri arabi"
  testo: "Nel 1202 il pisano Leonardo Fibonacci, con il Liber Abaci, diffuse in Europa i numeri indo-arabici e lo zero, mostrando ai mercanti quanto fossero più pratici dei numeri romani per fare i conti."
- emoji: "🌐"
  titolo: "Il World Wide Web"
  testo: "Il Web fu inventato al CERN di Ginevra da Tim Berners-Lee tra il 1989 e il 1991. Internet esisteva già: il Web è il sistema di pagine e link che ci viaggia sopra."
- emoji: "🧮"
  titolo: "Il TER, il costo nascosto"
  testo: "Il TER è il costo annuo di un fondo, già tolto dal rendimento. Sembra poco, ma su 30 anni la differenza tra un TER dello 0,2% e uno del 2% può mangiarsi più di un terzo del capitale finale."
- emoji: "🏁"
  titolo: "La regola del picco-fine"
  testo: "Ricordiamo un'esperienza soprattutto per il suo momento più intenso e per come è finita, non per la media. Vale per le vacanze, le riunioni e le presentazioni: cura bene la chiusura."
- emoji: "🎯"
  titolo: "La legge di Goodhart"
  testo: "«Quando una misura diventa un obiettivo, smette di essere una buona misura.» Se premi solo il numero di chiamate, otterrai tante chiamate, non per forza clienti più soddisfatti."
- emoji: "🍇"
  titolo: "Le Colline del Prosecco"
  testo: "Dal 2019 le Colline del Prosecco di Conegliano e Valdobbiadene sono Patrimonio dell'Umanità UNESCO, riconosciute per il paesaggio a «ciglioni», i terrazzamenti erbosi coltivati a vite."
- emoji: "📡"
  titolo: "Il transistor"
  testo: "Nel 1947 ai Bell Labs nacque il transistor, un minuscolo interruttore elettronico. Un processore moderno ne contiene decine di miliardi."
- emoji: "🗓️"
  titolo: "Il Piano di Accumulo"
  testo: "Il PAC investe una cifra fissa ogni mese: quando i prezzi scendono compri più quote, quando salgono ne compri meno. Così riduci il rischio di investire tutto nel momento sbagliato."
- emoji: "🔁"
  titolo: "Il ciclo delle abitudini"
  testo: "Ogni abitudine segue lo schema segnale → routine → ricompensa. Per crearne una nuova agganciala a un segnale che esiste già: «dopo il caffè del mattino, 10 minuti di lettura»."
- emoji: "🪒"
  titolo: "Il rasoio di Occam"
  testo: "A parità di condizioni, la spiegazione più semplice è di solito quella giusta. Prende il nome da Guglielmo di Occam, frate francescano del XIV secolo."
- emoji: "📉"
  titolo: "Il crollo del 1929"
  testo: "A fine ottobre 1929 Wall Street crollò, aprendo la strada alla Grande Depressione. Il Dow Jones impiegò circa 25 anni, fino al 1954, per tornare ai massimi del 1929."
- emoji: "🧬"
  titolo: "Due metri di DNA"
  testo: "Srotolando tutto il DNA di una sola cellula umana si otterrebbe un filo lungo circa 2 metri. La sua struttura a doppia elica fu descritta nel 1953 da Watson e Crick, grazie anche ai dati di Rosalind Franklin."
- emoji: "📉"
  titolo: "Prezzo e rendimento dei BTP"
  testo: "Prezzo e rendimento di un titolo di Stato si muovono in direzioni opposte: se i tassi salgono, i BTP già emessi, con cedole più basse, perdono valore. Se i tassi scendono, succede il contrario."
- emoji: "🧊"
  titolo: "Il paradosso della scelta"
  testo: "Troppe opzioni ci rendono più indecisi: in un noto esperimento un banco con 24 marmellate attirava più persone, ma uno con solo 6 ne faceva comprare molte di più."
- emoji: "📝"
  titolo: "La curva dell'oblio"
  testo: "A fine Ottocento Hermann Ebbinghaus scoprì che dimentichiamo gran parte di ciò che impariamo nel giro di pochi giorni. Ripassare a intervalli crescenti (1, 3, 7 giorni…) fissa i ricordi molto meglio."
- emoji: "💵"
  titolo: "Bretton Woods"
  testo: "Nel 1944 44 Paesi legarono le loro valute al dollaro, a sua volta convertibile in oro a 35 $ l'oncia. Nel 1971 Nixon sospese la convertibilità: da allora le valute non sono più agganciate all'oro."
- emoji: "🤖"
  titolo: "Il test di Turing"
  testo: "Nel 1950 Alan Turing propose un criterio per l'intelligenza delle macchine: se in una conversazione scritta non sai distinguere una macchina da una persona, la macchina «pensa». Oggi i modelli linguistici rendono la domanda molto concreta."
- emoji: "🇮🇹"
  titolo: "Lo spread"
  testo: "Lo spread BTP-Bund è la differenza tra il rendimento dei titoli di Stato italiani e tedeschi a 10 anni: 100 punti base equivalgono all'1%. Più è alto, più l'Italia paga per finanziarsi."
- emoji: "🤔"
  titolo: "Il costo opportunità"
  testo: "Il vero costo di una scelta è ciò a cui rinunci: un'ora sui social è un'ora in meno di sport, lettura o riposo. Vale anche per i soldi: 1.000 € fermi sul conto «costano» il rendimento che avrebbero potuto dare."
- emoji: "🎨"
  titolo: "Cima da Conegliano"
  testo: "Giovanni Battista Cima, detto Cima da Conegliano (circa 1459–1517), fu uno dei grandi pittori del Rinascimento veneziano. Nelle sue pale compaiono spesso paesaggi collinari che ricordano la sua terra."
- emoji: "💧"
  titolo: "L'acqua dolce"
  testo: "Circa il 97% dell'acqua della Terra è salata. Di quella dolce, la maggior parte è intrappolata nei ghiacci: quella facilmente accessibile in laghi e fiumi è meno dell'1% del totale."
- emoji: "🏷️"
  titolo: "Il rapporto P/E"
  testo: "Il rapporto prezzo/utili dice quante volte l'utile annuo stai pagando comprando un'azione. Un P/E alto può indicare grandi aspettative di crescita, oppure un titolo sopravvalutato."
- emoji: "🌙"
  titolo: "Il sonno"
  testo: "Per gli adulti si raccomandano 7-9 ore di sonno. Dormire poco peggiora concentrazione, memoria e giudizio, e chi è stanco tende a non accorgersene."
- emoji: "🍷"
  titolo: "La Scuola Enologica"
  testo: "Nel 1876 a Conegliano nacque la prima Scuola Enologica d'Italia, oggi Istituto «G.B. Cerletti». È una delle ragioni per cui la città è considerata una capitale del vino italiano."
- emoji: "🐂"
  titolo: "Toro e orso"
  testo: "Bull market (toro) è un mercato in rialzo, bear market (orso) in ribasso: per convenzione si parla di bear market dopo un calo di almeno il 20% dai massimi. Il toro colpisce con le corna verso l'alto, l'orso con le zampe verso il basso."
- emoji: "⏳"
  titolo: "L'effetto Lindy"
  testo: "Per idee, libri e tecnologie, più a lungo sono esistiti più è probabile che durino: un libro letto da 100 anni probabilmente lo sarà per altri 100. Un buon filtro per scegliere cosa leggere."
- emoji: "💶"
  titolo: "L'arrivo dell'euro"
  testo: "L'euro nacque il 1° gennaio 1999 per banche e mercati; banconote e monete arrivarono il 1° gennaio 2002, al cambio fisso di 1.936,27 lire."
- emoji: "🛟"
  titolo: "Il fondo di emergenza"
  testo: "Prima di investire, la regola pratica è tenere da parte 3-6 mesi di spese su un conto facilmente accessibile. Così un imprevisto non ti costringe a vendere gli investimenti nel momento peggiore."
- emoji: "🌡️"
  titolo: "L'effetto serra"
  testo: "Senza l'effetto serra naturale la temperatura media della Terra sarebbe di circa −18 °C, invece dei circa 15 °C attuali. Il problema non è l'effetto serra in sé, ma il suo aumento dovuto alle emissioni."
- emoji: "🦁"
  titolo: "La Serenissima"
  testo: "La Repubblica di Venezia durò più di mille anni, fino al 1797, quando cadde per mano di Napoleone. Il suo ducato d'oro fu per secoli una delle monete più affidabili del Mediterraneo."
- emoji: "🎢"
  titolo: "La volatilità"
  testo: "La volatilità misura quanto oscilla un prezzo. Non è di per sé una perdita: lo diventa solo se vendi quando il prezzo è basso. Per questo l'orizzonte temporale conta così tanto."
- emoji: "🧠"
  titolo: "Il cervello affamato"
  testo: "Il cervello pesa circa il 2% del corpo, ma consuma circa il 20% dell'energia che usiamo a riposo."
- emoji: "🏛️"
  titolo: "La BCE e i tassi"
  testo: "Quando la BCE alza i tassi, prestiti e mutui costano di più e l'economia rallenta, raffreddando l'inflazione; quando li abbassa succede il contrario. Il suo obiettivo è un'inflazione al 2% nel medio termine."
- emoji: "🔋"
  titolo: "Le batterie al litio"
  testo: "Le batterie agli ioni di litio durano di più se eviti di tenerle a lungo al 100% o di scaricarle a zero: la zona ideale è tra il 20% e l'80% circa. Per questo i telefoni offrono la «ricarica ottimizzata»."
- emoji: "📊"
  titolo: "La curva dei rendimenti"
  testo: "Di solito i titoli a lunga scadenza rendono più di quelli a breve. Quando succede il contrario (curva invertita), i mercati si aspettano un rallentamento: negli USA ha preceduto quasi tutte le recessioni recenti."
- emoji: "🌊"
  titolo: "Il MOSE"
  testo: "Il MOSE, il sistema di paratoie mobili che protegge Venezia dall'acqua alta, è entrato in funzione per la prima volta il 3 ottobre 2020."
- emoji: "💶"
  titolo: "Il dividendo"
  testo: "Il giorno dello stacco del dividendo il prezzo dell'azione scende all'incirca dell'importo pagato: il dividendo non è un regalo, ma una parte del valore dell'azienda che ti viene restituita in contanti."
- emoji: "🪙"
  titolo: "Bitcoin"
  testo: "Il documento che descrive Bitcoin fu pubblicato nel 2008 con lo pseudonimo Satoshi Nakamoto, la cui identità è ancora sconosciuta. Il numero massimo di bitcoin è fissato a 21 milioni."
